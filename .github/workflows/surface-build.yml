name: Surface Laptop 13 aarch64 ISO

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-iso:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 330
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: true

      - name: Runner facts
        run: |
          set -x
          uname -a
          nproc
          free -h
          df -h
          docker version --format '{{.Server.Version}}'

      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@v1.3.1
        continue-on-error: true

      - name: Build ISO
        run: |
          start=$(date +%s)
          ./bin/omarchy-iso-make --edge --keep-pkg-cache --no-boot-offer --arch aarch64 --media-target aarch64/snapdragon
          echo "ISO build wall-clock: $(( $(date +%s) - start ))s"

      - name: Inspect ISO
        run: |
          sudo apt-get install -y -qq xorriso >/dev/null
          ls -l release/
          for iso in release/*.iso; do
            echo "== $iso"
            sha256sum "$iso" | tee release/checksums.txt
            xorriso -indev "$iso" -lsl /arch/boot/aarch64/ 2>/dev/null
            # xorriso warns on missing paths but still exits 0: grep the output.
            out=$(xorriso -indev "$iso" -ls /arch/boot/aarch64/omarchy-live.efi 2>&1)
            echo "$out"
            grep -q "omarchy-live.efi'" <<< "$out"               || { echo "ISO is missing the DTB-carrying live UKI" >&2; exit 1; }
            out=$(xorriso -indev "$iso" -ls /arch/boot/aarch64/dtbs/qcom/x1p42100-microsoft-surface-laptop-13.dtb 2>&1)
            echo "$out"
            grep -q "x1p42100-microsoft-surface-laptop-13.dtb'" <<< "$out" \
              || { echo "ISO is missing the Surface Laptop 13 DTB" >&2; exit 1; }
          done
          df -h

      - name: Verify live airootfs contents
        run: |
          set -e
          sudo apt-get install -y -qq squashfs-tools >/dev/null
          iso=$(ls release/*.iso)
          work=/tmp/iso-verify
          rm -rf "$work" && mkdir -p "$work"
          # Extract the airootfs squashfs image out of the ISO.
          xorriso -osirrox on -indev "$iso" -extract /arch/aarch64/airootfs.sfs "$work/airootfs.sfs" >/dev/null 2>&1 \
            || xorriso -osirrox on -indev "$iso" -extract /arch/aarch64/airootfs.sfs.gz "$work/airootfs.sfs" >/dev/null
          listing="$work/airootfs.listing"
          unsquashfs -ll "$work/airootfs.sfs" > "$listing"
          require() { grep -q "$1" "$listing" || { echo "airootfs is missing: $1" >&2; exit 1; }; }
          require '/usr/local/bin/surface13-selfcheck$'
          require '/etc/systemd/system/multi-user.target.wants/sshd.service'   # symlink: unsquashfs -ll appends ' -> target', no $ anchor
          require '/etc/systemd/network/10-surface13-wired.network$'
          # mkarchiso deletes ALL of /boot from the airootfs before mksquashfs
          # (upstream "Cleaning up in pacstrap location"), so the live kernel,
          # UKI and dtbs exist ONLY on the ISO filesystem, never in the squashfs.
          out=$(xorriso -indev "$iso" -ls /arch/boot/aarch64/dtbs/qcom/x1p42100-microsoft-surface-laptop-13.dtb 2>&1)
          grep -q "x1p42100-microsoft-surface-laptop-13.dtb'" <<< "$out" \
            || { echo "ISO is missing the Surface Laptop 13 DTB" >&2; exit 1; }
          # Offline mirror packages whose absence previously broke installs.
          require 'var/cache/omarchy/mirror/offline/openssh-[^/]*pkg.tar'
          require 'var/cache/omarchy/mirror/offline/systemd-ukify-[^/]*pkg.tar'
          require 'var/cache/omarchy/mirror/offline/surface-laptop-13-support-[^/]*pkg.tar'
          # The kernel in the live env must be the patched epoch-1 build.
          require 'var/cache/omarchy/mirror/offline/linux-aarch64-1:7.2.6-1-aarch64.pkg.tar'   # epoch-pinned: our patched build, not stock
          echo "-- WCN7850 firmware inventory (warning only):"
          grep -iE 'firmware/qcom/[^ ]*WCN7850' "$listing" | head -20 || \
            echo "WARNING: no WCN7850 firmware paths under firmware/qcom - wifi may be degraded"
          echo "-- UFS/Venus firmware inventory (warning only):"
          grep -iE 'firmware/qcom/[^ ]*(venus|x1p42100|ufs)' "$listing" | head -20 || true
          # The live kernel Image rides inside the UKI on the ISO; check the
          # patched-build version string in its .linux section.
          xorriso -osirrox on -indev "$iso" -extract /arch/boot/aarch64/omarchy-live.efi "$work/omarchy-live.efi" >/dev/null
          objcopy -O binary --only-section=.linux "$work/omarchy-live.efi" "$work/vmlinuz" 2>/dev/null \
            || cp "$work/omarchy-live.efi" "$work/vmlinuz"
          if zcat "$work/vmlinuz" 2>/dev/null | grep -q '7.2.6-1-aarch64-ARCH'; then
            echo "live kernel version string verified"
          else
            strings "$work/vmlinuz" | grep -m1 'Linux version' || true
            strings "$work/vmlinuz" | grep -q '7.2.6-1-aarch64-ARCH' \
              || { echo "live kernel is NOT the patched 7.2.6-1-aarch64-ARCH build" >&2; exit 1; }
          fi
          echo "airootfs verification passed"

      - name: Split ISO into release-sized parts
        run: |
          set -e
          iso=$(ls release/*.iso)
          base=$(basename "$iso" .iso)
          size=$(stat -c %s "$iso")
          echo "ISO size: $size"
          if (( size > 1900000000 )); then
            split -b 1900m -d -a 2 "$iso" "release/${base}.part"
            rm "$iso"
            ls -l release/
          fi

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: omarchy-surface-laptop-13-aarch64-${{ github.run_number }}
          path: ./release/
          if-no-files-found: error
          retention-days: 7

      - name: Write release notes
        run: |
          set -e
          {
            echo "# Omarchy aarch64 ISO - Surface Laptop 13 (2095, Snapdragon X Plus X1P42100) - FINAL build ${{ github.run_number }}"
            echo
            echo "Built $(date -u +%Y-%m-%d) from omacom/omarchy@dragon with the patched display kernel"
            echo "(7.2.6 + UFS Kioxia quirk + LGD-07AD panel + keep-eDP-alive, eDP path built INTO the Image)."
            echo
            echo "## SHA-256 (verify before AND after flashing)"
            echo '```'
            cat release/checksums.txt
            echo '```'
            echo "If the ISO is split into .partNN files, reassemble first:"
            echo '```'
            echo "cat omarchy-*.part* > omarchy.iso"
            echo "sha256sum omarchy.iso   # must match the .iso line above"
            echo '```'
            echo
            echo "## USE A FRESH USB STICK"
            echo "The old stick's NAND is worn and silently corrupts images after many flashes."
            echo "Flash with EtchDroid (raw DD image mode) on the Retroid, or balenaEtcher anywhere else."
            echo "balenaEtcher verifies after flashing automatically; with dd/EtchDroid, compare the"
            echo "SHA-256 of the reassembled image against the table above before booting it."
            echo
            echo "## First boot"
            echo "1. Secure Boot stays OFF."
            echo "2. Boot the stick. The GRUB menu defaults to the Surface entry after 5s."
            echo "   Alternates (not defaults): VERBOSE logging, msm.modeset=0 display fallback,"
            echo "   no-plymouth, EMERGENCY shell."
            echo "3. At the live root shell, run: surface13-selfcheck"
            echo "   It PASS/FAILs the DTB keep-eDP properties, built-in msm, UFS MCQ quirk,"
            echo "   WCN7850 firmware, sshd, and networking."
            echo "4. sshd is ON: root password surface13. iPhone tether: plug in with Personal"
            echo "   Hotspot on (DNS is pre-baked; if it still fails: echo nameserver 1.1.1.1 > /etc/resolv.conf)."
            echo "5. Install as usual. The installed system boots the same patched kernel via UKI"
            echo "   (limine fallback retained) with the LUKS + btrfs layout you choose."
          } > release/RELEASE_NOTES.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: surface-v${{ github.run_number }}
          name: Omarchy aarch64 ISO for Surface Laptop 13 - FINAL (build ${{ github.run_number }})
          body_path: release/RELEASE_NOTES.md
          files: release/*
          fail_on_unmatched_files: true
